<!doctype html>
<!-- Source for docs/og-image*.png; rendered by scripts/render-og.sh.
     ?lang=ja switches the copy and the illustration. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Manrope:wght@620;800&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { position: relative; background: radial-gradient(circle at 18% 0%, #fbe6df 0, transparent 55%), #faf8f4; color: #1c1a17; font-family: Manrope, "Hiragino Sans", sans-serif; }
.left { position: absolute; left: 72px; top: 92px; width: 480px; }
.brand { display: flex; align-items: center; gap: 10px; color: #8d867a; font-weight: 800; letter-spacing: .2em; font-size: 18px; text-transform: uppercase; }
.brand svg { width: 26px; height: 26px; color: #d9664e; }
h1 { margin: 34px 0 26px; font-family: Fraunces, "Hiragino Mincho ProN", serif; font-weight: 650; font-size: 84px; line-height: .98; letter-spacing: -.035em; }
p { margin: 0; color: #6f685c; font-size: 25px; line-height: 1.35; }
.meta { margin-top: 30px; color: #8d867a; font-size: 18px; font-weight: 800; }
.shot { position: absolute; top: 60px; right: -60px; width: 660px; border-radius: 14px 0 0 0; box-shadow: 0 30px 70px rgba(28, 26, 23, .2); }
:lang(ja) h1 { font-size: 54px; line-height: 1.2; letter-spacing: 0; }
:lang(ja) p { font-size: 23px; }
</style>
</head>
<body>
<div class="left">
  <div class="brand"><svg viewBox="4 5 15 14"><circle cx="7" cy="12" r="2.6" fill="currentColor"/><path d="M12.5 7 17.5 12 12.5 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Until</div>
  <h1 id="title">Next up, always visible.</h1>
  <p id="lede">Your next meeting in the macOS menu bar, your day on one timeline, notes in one click.</p>
  <div class="meta" id="meta">Free &amp; open source · macOS</div>
</div>
<img class="shot" id="shot" src="../docs/art/hero-en.svg">
<script>
if (new URLSearchParams(location.search).get("lang") === "ja") {
  document.documentElement.lang = "ja";
  document.getElementById("title").innerHTML = "次の予定を、<br>いつも目の前に。";
  document.getElementById("lede").textContent = "次の会議までのカウントダウンをメニューバーに。一日をひとつのタイムラインで。議事録はワンクリック。";
  document.getElementById("meta").textContent = "無料・オープンソース · macOS";
  document.getElementById("shot").src = "../docs/art/hero-ja.svg";
}
</script>
</body>
</html>
